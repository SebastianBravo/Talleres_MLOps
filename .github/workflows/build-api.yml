name: Build & Push — API de Inferencia

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "Proyecto_3/api/**"
      - ".github/workflows/build-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "Proyecto_3/api/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para el write-back del tag al manifiesto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Proyecto_3/api
          file: ./Proyecto_3/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mlops-api
          cache-to: type=gha,mode=max,scope=mlops-api

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # GitOps write-back: apunta el manifiesto al tag inmutable sha-<commit>.
      # Argo CD detecta el cambio en Git y redespliega la API automaticamente.
      # El commit toca solo manifests/, que no esta en los paths de este
      # workflow, asi que no se vuelve a disparar el build (sin bucle).
      - name: GitOps write-back — actualizar tag en el manifiesto
        if: github.event_name != 'pull_request'
        run: |
          set -e
          TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          FILE="Proyecto_3/manifests/app/api/api-deployment.yaml"
          BRANCH="${GITHUB_REF_NAME}"
          # Reutiliza el mensaje y autor del commit que disparo el build, para que
          # en Argo se vea ese mensaje y no un "set image ..." generico del bot.
          SUBJECT="$(git log -1 --pretty=%s "${GITHUB_SHA}")"
          AUTHOR_NAME="$(git log -1 --pretty=%an "${GITHUB_SHA}")"
          AUTHOR_EMAIL="$(git log -1 --pretty=%ae "${GITHUB_SHA}")"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reintenta para tolerar pushes concurrentes (p.ej. el workflow de streamlit).
          # En cada intento se reposiciona sobre la punta mas reciente de la rama.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            sed -i -E "s#(image: ${IMAGE_NAME}:).*#\1${TAG}#" "$FILE"
            if git diff --quiet -- "$FILE"; then
              echo "El manifiesto ya apunta a ${TAG}; nada que hacer."
              exit 0
            fi
            git add "$FILE"
            git commit --author="${AUTHOR_NAME} <${AUTHOR_EMAIL}>" \
              -m "${SUBJECT} [deploy ${TAG}] [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Manifiesto actualizado a ${TAG} (intento $attempt)."
              exit 0
            fi
            echo "Push rechazado (intento $attempt); reintento sobre el tip mas reciente..."
            sleep 3
          done
          echo "No se pudo pushear el write-back tras varios intentos." >&2
          exit 1
