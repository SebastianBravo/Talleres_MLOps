apiVersion: v1
kind: Pod
metadata:
  name: minio-init
  namespace: mlops-infra
  labels:
    app: minio-init
  annotations:
    # Argo CD: ejecuta este Pod como hook PostSync (tras desplegar la infra) y lo
    # elimina al terminar, evitando que quede como recurso huérfano que Argo
    # intente recrear/marcar OutOfSync en cada sync. Fuera de Argo (make minio-init)
    # el Pod corre igual: estas anotaciones son inertes para kubectl.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  containers:
    - name: minio-init
      image: minio/mc:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
      command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MinIO...";

          until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "MinIO not ready yet...";
            sleep 2;
          done;

          echo "MinIO ready";

          mc mb -p local/mlflows3;
          mc anonymous set none local/mlflows3;
          mc mb -p local/real-estate-project;
  restartPolicy: Never
