apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-source
  namespace: mlops-infra
  labels:
    app: api-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-source
  template:
    metadata:
      labels:
        app: api-source
    spec:
      containers:
        - name: api-source
          image: cristiandiaz13/mlops-puj:data-api-pf-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
