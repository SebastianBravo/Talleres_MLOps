apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops

  # App-of-Apps: esta Application raíz solo gestiona el directorio de
  # Applications hijas. Cada hija despliega una capa del sistema.
  source:
    repoURL: https://github.com/SebastianBravo/Talleres_MLOps.git
    targetRevision: feature/proyecto3_airflow
    path: Proyecto_3/manifests/argocd/applications
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
