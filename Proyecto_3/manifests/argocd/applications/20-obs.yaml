apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-obs
  namespace: argocd
  annotations:
    # Wave 2: observabilidad (prometheus, grafana, locust). Mismo wave que app:
    # ambas dependen solo de infra, no entre sí.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops

  source:
    repoURL: https://github.com/SebastianBravo/Talleres_MLOps.git
    targetRevision: feature/proyecto3_airflow
    path: Proyecto_3/manifests/obs
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-obs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
