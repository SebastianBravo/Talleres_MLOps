apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-obs
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "inference-api"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api.mlops-app.svc.cluster.local:8000"]

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
