version: '3.8'

services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8085:80"
    environment:
      PMA_HOST: host.docker.internal   # Tu MySQL local
      PMA_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"