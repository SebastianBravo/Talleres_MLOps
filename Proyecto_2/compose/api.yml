# API de datos (Covertype) para pruebas locales.
# Sirve datos por batches; el DAG de Airflow se conecta a este servicio como api-data.

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: InferenceAPI
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - mlflow
    restart: always
