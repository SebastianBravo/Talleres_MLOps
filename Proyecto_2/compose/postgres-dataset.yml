services:
  postgres-dataset:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: diabetic_data
      # POSTGRES_HOST_AUTH_METHOD: md5
      # POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres-dataset-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "diabetic_data"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

volumes:
  postgres-dataset-db-volume:
