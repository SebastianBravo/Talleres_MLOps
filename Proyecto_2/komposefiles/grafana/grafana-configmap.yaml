apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

  api_dashboard.json: |
    {
      "id": null,
      "uid": "diabetes-api-obs",
      "title": "Diabetes API - Observabilidad",
      "tags": ["mlops", "diabetes", "api"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total de solicitudes",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [{ "expr": "sum(http_requests_total)", "legendFormat": "Total", "refId": "A" }]
        },
        {
          "id": 2,
          "title": "Solicitudes por segundo (RPS)",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } },
          "targets": [{ "expr": "sum(rate(http_requests_total[1m]))", "legendFormat": "RPS", "refId": "A" }]
        },
        {
          "id": 3,
          "title": "Total de errores (5xx)",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "sum(http_requests_total{status_code=~\"5..\"})", "legendFormat": "Errores", "refId": "A" }]
        },
        {
          "id": 4,
          "title": "Tasa de error (%)",
          "type": "gauge",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 20 }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "100 * sum(rate(http_requests_total{status_code=~\"5..\"}[1m])) / sum(rate(http_requests_total[1m]))", "legendFormat": "Error rate", "refId": "A" }]
        },
        {
          "id": 5,
          "title": "Solicitudes por segundo por endpoint",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 } } },
          "targets": [{ "expr": "sum by (handler) (rate(http_requests_total[1m]))", "legendFormat": "{{handler}}", "refId": "A" }]
        },
        {
          "id": 6,
          "title": "Errores por segundo (5xx)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 }, "color": { "fixedColor": "red", "mode": "fixed" } } },
          "targets": [{ "expr": "sum by (handler) (rate(http_requests_total{status_code=~\"5..\"}[1m]))", "legendFormat": "{{handler}} - errores", "refId": "A" }]
        },
        {
          "id": 7,
          "title": "Latencia promedio (ms)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 12, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 2000 }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "1000 * sum(rate(http_request_duration_seconds_sum[1m])) / sum(rate(http_request_duration_seconds_count[1m]))", "legendFormat": "Latencia promedio", "refId": "A" }]
        },
        {
          "id": 8,
          "title": "Latencia p50 (ms)",
          "type": "stat",
          "gridPos": { "x": 6, "y": 12, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 1 } },
          "targets": [{ "expr": "1000 * histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p50", "refId": "A" }]
        },
        {
          "id": 9,
          "title": "Latencia p95 (ms)",
          "type": "stat",
          "gridPos": { "x": 12, "y": 12, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1000 }, { "color": "red", "value": 3000 }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "1000 * histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p95", "refId": "A" }]
        },
        {
          "id": 10,
          "title": "Latencia p99 (ms)",
          "type": "stat",
          "gridPos": { "x": 18, "y": 12, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "unit": "ms", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 2000 }, { "color": "red", "value": 5000 }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "1000 * histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p99", "refId": "A" }]
        },
        {
          "id": 11,
          "title": "Histograma de latencia por percentil",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2 } } },
          "targets": [
            { "expr": "1000 * histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "1000 * histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p95", "refId": "B" },
            { "expr": "1000 * histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p99", "refId": "C" },
            { "expr": "1000 * sum(rate(http_request_duration_seconds_sum[1m])) / sum(rate(http_request_duration_seconds_count[1m]))", "legendFormat": "promedio", "refId": "D" }
          ]
        }
      ]
    }
